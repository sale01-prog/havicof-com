<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product | HAVICO</title>
<meta name="robots" content="noindex">
<script>
  // old links were product.html?p=<slug>; each product now has its own page in products/
  var s = new URLSearchParams(location.search).get("p") || "";
  s = { "olso-sofa": "oslo-sofa" }[s] || s;
  location.replace(/^[a-z0-9-]+$/.test(s) ? "products/" + s + ".html" : "products.html");
</script>
</head>
<body>
<p><a href="products.html">See all HAVICO products</a></p>
</body>
</html>
